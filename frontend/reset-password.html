<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Réinitialiser le mot de passe — UATM Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/login.css" />
<link rel="stylesheet" href="css/register.css" />
</head>
<body>

<div class="register-screen">
  <div class="register-card">

    <div class="register-header">
      <div class="seal"><img src="medias/logo-gasa.jpeg" alt="Logo GASA Formation" /></div>
      <span>UATM Connect</span>
    </div>

    <form id="resetForm" novalidate>
      <h2>Nouveau mot de passe</h2>
      <p class="subtitle">Choisissez un nouveau mot de passe pour votre compte.</p>

      <div class="error-banner" id="errorBanner"></div>

      <div class="field">
        <label for="nouveauMotDePasse">Nouveau mot de passe</label>
        <input type="password" id="nouveauMotDePasse" required />
      </div>
      <div class="field">
        <label for="confirmation">Confirmer le mot de passe</label>
        <input type="password" id="confirmation" required />
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Mettre à jour le mot de passe</button>
    </form>

    <div class="success-panel" id="successPanel">
      <div class="seal">✓</div>
      <h2>Mot de passe mis à jour</h2>
      <p>Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>
      <a class="back-link" href="login.html">Aller à la connexion</a>
    </div>

  </div>
</div>

<script src="js/config.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
